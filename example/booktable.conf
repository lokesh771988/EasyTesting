# BookTable - display all values
# (Only the first # starts a test case; other # lines would start a new case and break forEach body.)

headless=false
goto:https://testautomationpractice.blogspot.com/
wait:3000

forEach:table[name="BookTable"] tbody tr
getText=>> *:nth-child(1)=col1
getText=>> *:nth-child(2)=col2
getText=>> *:nth-child(3)=col3
getText=>> *:nth-child(4)=col4
display=$col1
display=$col2
display=$col3
display=$col4
endForEach
